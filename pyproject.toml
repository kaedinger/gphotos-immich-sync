[project]
name = "gphotos-immich-sync"
version = "0.1.0"
description = "Sync Google Photos albums to Immich by matching filenames + metadata. No photo download."
authors = [
    { name = "kaedinger", email = "fk@kaedinger.de" }
]
requires-python = ">=3.14"
dependencies = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
gphotos-immich-sync = "gphotos_immich_sync:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
